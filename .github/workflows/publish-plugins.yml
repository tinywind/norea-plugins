name: Validate and publish plugins

on:
  pull_request:
  push:
    branches-ignore:
      - "dist/**"
      - "plugins/**"
      - "**/plugins/**"
      - "dependabot/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  NODE_IMAGE: node:24-bookworm

jobs:
  validate:
    name: Validate plugins and artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      publish_requested: ${{ steps.publication.outputs.publish }}
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select release-branch publication
        id: publication
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/') && !startsWith(github.ref, 'refs/heads/dependabot/')
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$SOURCE_BRANCH" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Validation only: $SOURCE_BRANCH is not a version branch such as 0.2." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cache npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/npm-cache
          key: norea-plugins-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            norea-plugins-npm-

      - name: Install locked dependencies in Node container
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/container-home" "$RUNNER_TEMP/npm-cache"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/container-home:/tmp/home" \
            -v "$RUNNER_TEMP/npm-cache:/npm-cache" \
            -w /workspace \
            -e CI=true \
            -e HOME=/tmp/home \
            -e npm_config_cache=/npm-cache \
            "$NODE_IMAGE" \
            npm ci

      - name: Verify generated plugin index
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/container-home:/tmp/home" \
            -w /workspace \
            -e CI=true \
            -e HOME=/tmp/home \
            "$NODE_IMAGE" \
            node scripts/generate-plugin-index.js
          git diff --exit-code -- plugins/index.ts

      - name: Run formatting, lint, typecheck, and compile checks
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/container-home:/tmp/home" \
            -v "$RUNNER_TEMP/npm-cache:/npm-cache" \
            -w /workspace \
            -e CI=true \
            -e HOME=/tmp/home \
            -e npm_config_cache=/npm-cache \
            "$NODE_IMAGE" \
            npm run verify:commit

      - name: Run plugin and EPUB tests
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/container-home:/tmp/home" \
            -v "$RUNNER_TEMP/npm-cache:/npm-cache" \
            -w /workspace \
            -e CI=true \
            -e HOME=/tmp/home \
            -e npm_config_cache=/npm-cache \
            "$NODE_IMAGE" \
            bash -euo pipefail -c '
              npm run test:novel-identity
              npm run test:epub
              npm run test:contract
            '

      - name: Verify manifest and compiled plugin artifacts
        env:
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          target_branch="${BASE_REF:-$REF_NAME}"
          verification_branch="dist/${target_branch#dist/}"
          rm -rf .dist .js total.svg
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/container-home:/tmp/home" \
            -v "$RUNNER_TEMP/npm-cache:/npm-cache" \
            -w /workspace \
            -e CI=true \
            -e HOME=/tmp/home \
            -e npm_config_cache=/npm-cache \
            -e BRANCH="$verification_branch" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0='*' \
            "$NODE_IMAGE" \
            bash -euo pipefail -c '
              npm run build:compile
              npm run build:manifest
              npm run verify:plugins
            '
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code

  publish:
    name: Publish dist branch
    needs: validate
    if: needs.validate.outputs.publish_requested == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publish-dist-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      SOURCE_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Skip an outdated branch commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(docker run --rm -i \
            -e GH_TOKEN \
            -e GITHUB_REPOSITORY \
            -e SOURCE_BRANCH \
            "$NODE_IMAGE" \
            node --input-type=module <<'NODE'
          const branchPath = process.env.SOURCE_BRANCH.split('/').map(encodeURIComponent).join('/');
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/${branchPath}`, {
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'User-Agent': 'norea-plugins-ci',
              'X-GitHub-Api-Version': '2022-11-28',
            },
          });
          if (!response.ok) {
            throw new Error(`GitHub API ${response.status}: ${await response.text()}`);
          }
          const data = await response.json();
          console.log(data.object.sha);
          NODE
          )"
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Publication skipped: branch $SOURCE_BRANCH has advanced beyond $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out the exact source commit
        if: steps.current.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Cache npm dependencies
        if: steps.current.outputs.publish == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/npm-cache
          key: norea-plugins-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            norea-plugins-npm-

      - name: Install locked dependencies in Node container
        if: steps.current.outputs.publish == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/container-home" "$RUNNER_TEMP/npm-cache"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/container-home:/tmp/home" \
            -v "$RUNNER_TEMP/npm-cache:/npm-cache" \
            -w /workspace \
            -e CI=true \
            -e HOME=/tmp/home \
            -e npm_config_cache=/npm-cache \
            "$NODE_IMAGE" \
            npm ci

      - name: Publish compiled artifacts to dist/<branch>
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOREA_PUBLISH_IN_DOCKER: "1"
          NPM_CACHE_DIR: ${{ runner.temp }}/npm-cache
        run: |
          set -euo pipefail
          head="$(docker run --rm -i \
            -e GH_TOKEN \
            -e GITHUB_REPOSITORY \
            -e SOURCE_BRANCH \
            "$NODE_IMAGE" \
            node --input-type=module <<'NODE'
          const branchPath = process.env.SOURCE_BRANCH.split('/').map(encodeURIComponent).join('/');
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/${branchPath}`, {
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'User-Agent': 'norea-plugins-ci',
              'X-GitHub-Api-Version': '2022-11-28',
            },
          });
          if (!response.ok) {
            throw new Error(`GitHub API ${response.status}: ${await response.text()}`);
          }
          const data = await response.json();
          console.log(data.object.sha);
          NODE
          )"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "Publication skipped: branch $SOURCE_BRANCH advanced while preparing artifacts." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          unset GH_TOKEN
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/publish-plugins.sh origin "$SOURCE_BRANCH"
          dist_sha="$(git ls-remote origin "refs/heads/dist/$SOURCE_BRANCH" | cut -f1)"
          {
            echo "## Published plugin artifacts"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Source branch: $SOURCE_BRANCH"
            echo "- Artifact branch: dist/$SOURCE_BRANCH"
            echo "- Artifact commit: $dist_sha"
          } >> "$GITHUB_STEP_SUMMARY"
